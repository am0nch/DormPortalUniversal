<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RA Portal — DormPortalUniversal</title>
  <script src="../dorm-db.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; font-family: 'Segoe UI', system-ui, sans-serif; background:#f0f4f8; min-height:100vh; }

    /* Header */
    .rp-header { background:#1e3a5f; color:#fff; padding:14px 16px 12px; }
    .rp-header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .rp-dorm { font-size:1.1rem; font-weight:700; line-height:1.2; }
    .rp-user-chip { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); color:#fff; font-size:.8rem; padding:4px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; margin-top:2px; }
    .rp-user-chip:hover { background:rgba(255,255,255,.28); }
    .rp-meta { font-size:.78rem; opacity:.75; margin-top:4px; }
    .rp-curfew-banner { background:rgba(255,255,255,.12); border-radius:6px; padding:6px 12px; margin-top:10px; font-size:.82rem; display:flex; align-items:center; gap:8px; }
    .rp-curfew-banner span.icon { font-size:1rem; }

    /* Main grid */
    .rp-grid { padding:14px 12px 24px; display:flex; flex-direction:column; gap:12px; max-width:480px; margin:0 auto; }

    /* Cards */
    .rp-card { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.09); padding:16px; }
    .rp-card-title { font-size:1rem; font-weight:700; color:#1e3a5f; display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .rp-card-title .icon { font-size:1.25rem; }

    /* Buttons */
    .rp-btn { display:block; padding:14px 16px; border-radius:10px; text-decoration:none; font-size:.97rem; font-weight:600; text-align:center; border:none; cursor:pointer; width:100%; margin-bottom:8px; transition:opacity .15s; }
    .rp-btn:last-child { margin-bottom:0; }
    .rp-btn:active { opacity:.8; }
    .rp-btn-navy  { background:#1e3a5f; color:#fff; }
    .rp-btn-ghost { background:#f0f4f8; color:#1e3a5f; }
    .rp-btn-green { background:#2e7d32; color:#fff; }
    .rp-btn-red   { background:#c62828; color:#fff; }
    .rp-btn-amber { background:#e65100; color:#fff; }

    /* Footer */
    .rp-footer { text-align:center; padding:8px 0 20px; }
    .rp-footer a { color:#90a4ae; font-size:.78rem; text-decoration:none; }

    /* Identity modal */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9000; align-items:center; justify-content:center; }
    .modal-backdrop.open { display:flex; }
    .modal-box { background:#fff; border-radius:14px; width:min(360px,92vw); padding:0; overflow:hidden; }
    .modal-head { background:#1e3a5f; color:#fff; padding:14px 18px; font-weight:700; font-size:.95rem; }
    .modal-body { padding:18px; }
    .modal-body label { font-size:.8rem; font-weight:700; color:#555; display:block; margin-bottom:6px; }
    .modal-body select { width:100%; font-size:.9rem; padding:8px 10px; border:1px solid #ccc; border-radius:8px; margin-bottom:14px; }
    .modal-body .name-input { width:100%; font-size:.9rem; padding:8px 10px; border:1px solid #ccc; border-radius:8px; margin-bottom:14px; display:none; }
    .modal-save { width:100%; padding:12px; background:#1e3a5f; color:#fff; border:none; border-radius:8px; font-size:.95rem; font-weight:700; cursor:pointer; }

    @media (prefers-color-scheme: dark) {
      body { background:#121c2b; }
      .rp-card { background:#1a2535; box-shadow:0 2px 10px rgba(0,0,0,.3); }
      .rp-card-title { color:#90caf9; }
      .rp-btn-ghost { background:#243044; color:#90caf9; }
      .rp-footer a { color:#546e7a; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div class="rp-header">
  <div class="rp-header-top">
    <div>
      <div class="rp-dorm" id="rpDorm">RA Portal</div>
      <div class="rp-meta" id="rpFloors"></div>
    </div>
    <button class="rp-user-chip" id="rpUserChip" onclick="openIdentityModal()">👤 …</button>
  </div>
  <div class="rp-curfew-banner" id="rpCurfewBanner" style="display:none">
    <span class="icon">🕙</span>
    <span id="rpCurfewText"></span>
  </div>
</div>

<!-- Main grid -->
<div class="rp-grid">

  <!-- Attendance -->
  <div class="rp-card">
    <div class="rp-card-title"><span class="icon">🌙</span> Nightly Attendance</div>
    <a class="rp-btn rp-btn-navy" href="attendance.html?back=ra-portal">Start / Continue Check-In</a>
  </div>

  <!-- Room Inspection -->
  <div class="rp-card">
    <div class="rp-card-title"><span class="icon">🔍</span> Room Inspection</div>
    <a class="rp-btn rp-btn-green" href="room-inspection.html?back=ra-portal&tab=checkin">📥 Move-In Inspection</a>
    <a class="rp-btn rp-btn-ghost" href="room-inspection.html?back=ra-portal&tab=checkout">📤 Move-Out Inspection</a>
  </div>

  <!-- Incidents -->
  <div class="rp-card">
    <div class="rp-card-title"><span class="icon">🚨</span> Incident Reports</div>
    <a class="rp-btn rp-btn-red" href="incidents.html?back=ra-portal">New Incident Report</a>
    <a class="rp-btn rp-btn-ghost" href="incidents.html?back=ra-portal">View All Incidents</a>
  </div>

  <!-- Data backup -->
  <div class="rp-card">
    <div class="rp-card-title"><span class="icon">💾</span> Data Backup</div>
    <button class="rp-btn rp-btn-amber" onclick="rpExport()">💾 Export My Backup</button>
    <input type="file" id="rpMergeInput" accept=".json" style="display:none" onchange="rpMerge(this)">
    <button class="rp-btn rp-btn-ghost" onclick="document.getElementById('rpMergeInput').click()">🔀 Merge a Backup</button>
  </div>

</div>

<div class="rp-footer">
  <a href="../index.html">← Full Dean Menu</a>
</div>

<!-- Identity modal -->
<div class="modal-backdrop" id="identityModal">
  <div class="modal-box">
    <div class="modal-head">👤 Who are you?</div>
    <div class="modal-body">
      <label for="rpRaSelect">Select your name from the RA list</label>
      <select id="rpRaSelect" onchange="onRaSelectChange()">
        <option value="">— Select —</option>
      </select>
      <input class="name-input" id="rpRaCustom" type="text" placeholder="Type your name" id="rpRaCustom">
      <button class="modal-save" onclick="saveIdentity()">✅ Confirm</button>
    </div>
  </div>
</div>

<script>
const KNOWN_CATEGORIES = ['RA', 'Monitor'];

function rpInit() {
  document.getElementById('rpDorm').textContent = (DormDB.getDormName() || 'Dorm') + ' — RA Portal';

  // Populate identity dropdown
  const workers = (DormDB.getWorkers ? DormDB.getWorkers() : [])
    .filter(w => KNOWN_CATEGORIES.includes(w.category));
  const sel = document.getElementById('rpRaSelect');
  workers.forEach(w => {
    const opt = document.createElement('option');
    opt.value = w.name;
    const area = w.floor ? ' — Floor ' + w.floor : (w.assignedArea ? ' — ' + w.assignedArea : '');
    opt.textContent = w.name + (w.category !== 'RA' ? ' (' + w.category + ')' : '') + area;
    sel.appendChild(opt);
  });
  // Add "Other" option for manual entry
  const other = document.createElement('option');
  other.value = '__other__';
  other.textContent = 'Other (type name below)';
  sel.appendChild(other);

  // Restore saved identity
  const saved = DormDB.getCurrentUser();
  if (saved) {
    // Try to pre-select
    const opt = [...sel.options].find(o => o.value === saved);
    if (opt) { sel.value = saved; } else { sel.value = '__other__'; document.getElementById('rpRaCustom').value = saved; document.getElementById('rpRaCustom').style.display = 'block'; }
    applyIdentity(saved, workers);
  } else {
    openIdentityModal();
  }

  // Curfew
  const cfg = DormDB.getCurfewCfg ? DormDB.getCurfewCfg() : {};
  const today = new Date().getDay(); // 0=Sun,6=Sat
  const isWeekend = today === 0 || today === 5 || today === 6;
  const curfewTime = isWeekend ? (cfg.weekendCurfew || cfg.weekendCurfew) : cfg.weekdayCurfew;
  if (curfewTime) {
    document.getElementById('rpCurfewBanner').style.display = 'flex';
    document.getElementById('rpCurfewText').textContent = 'Tonight\'s curfew: ' + curfewTime + (cfg.graceMinutes ? ' (grace: ' + cfg.graceMinutes + ' min)' : '');
  }
}

function applyIdentity(name, workers) {
  workers = workers || (DormDB.getWorkers ? DormDB.getWorkers() : []).filter(w => KNOWN_CATEGORIES.includes(w.category));
  document.getElementById('rpUserChip').textContent = '👤 ' + (name || 'Set identity');
  const me = workers.find(w => w.name === name);
  const floorEl = document.getElementById('rpFloors');
  const area = me ? (me.floor || me.assignedArea || '') : '';
  floorEl.textContent = area ? 'Your area: Floor ' + area : '';
}

function onRaSelectChange() {
  const val = document.getElementById('rpRaSelect').value;
  document.getElementById('rpRaCustom').style.display = val === '__other__' ? 'block' : 'none';
}

function openIdentityModal() {
  document.getElementById('identityModal').classList.add('open');
}

function saveIdentity() {
  const sel = document.getElementById('rpRaSelect');
  const name = sel.value === '__other__'
    ? document.getElementById('rpRaCustom').value.trim()
    : sel.value;
  if (!name) return alert('Please select or enter your name.');
  DormDB.saveCurrentUser(name);
  applyIdentity(name);
  document.getElementById('identityModal').classList.remove('open');
}

async function rpExport() {
  try {
    const dump = await DormDB.exportAll();
    const failed = dump._photosFailed || 0;
    delete dump._photosFailed;
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const user = (DormDB.getCurrentUser() || 'RA').replace(/\s+/g, '_');
    const filename = 'RA_Backup_' + user + '_' + new Date().toISOString().slice(0, 10) + '.json';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    if (failed > 0) alert(failed + ' photo(s) could not be exported.');
    // Try M365 upload if configured
    const m365 = DormDB.getM365Cfg ? DormDB.getM365Cfg() : {};
    if (m365.enabled && m365.clientId && m365.accessToken && m365.tokenExpiry > Date.now()) {
      const folder = encodeURIComponent(m365.folderPath || 'Nightly Checking');
      const url = `https://graph.microsoft.com/v1.0/me/drive/root:/${folder}/${encodeURIComponent(filename)}:/content`;
      fetch(url, { method:'PUT', headers:{ Authorization:'Bearer '+m365.accessToken, 'Content-Type':'application/octet-stream' }, body: blob })
        .then(r => { if (r.ok) showToast('☁️ Uploaded to OneDrive — ' + (m365.folderPath || 'Nightly Checking')); else showToast('⚠️ OneDrive upload failed', '#c62828'); })
        .catch(e => showToast('⚠️ OneDrive error: ' + e.message, '#c62828'));
    }
  } catch(e) { alert('Export failed: ' + e.message); }
}

async function rpMerge(input) {
  const file = input.files[0]; if (!file) return; input.value = '';
  let dump;
  try { dump = JSON.parse(await file.text()); }
  catch { return alert('Invalid backup file — could not parse JSON.'); }
  if (!confirm('Merge this backup into current data? Only new records will be added — nothing will be overwritten.')) return;
  const result = await DormDB.mergeAll(dump);
  alert(result.totalAdded === 0
    ? '✅ Merge complete — no new records found (all already present).'
    : '✅ Merged ' + result.totalAdded + ' new record' + (result.totalAdded !== 1 ? 's' : '') + '.');
}

function showToast(msg, color) {
  const t = document.createElement('div');
  t.textContent = msg;
  Object.assign(t.style, { position:'fixed', bottom:'20px', right:'16px', background:color||'#2e7d32', color:'#fff', padding:'10px 16px', borderRadius:'10px', fontSize:'.85rem', boxShadow:'0 2px 8px rgba(0,0,0,.25)', zIndex:9999, maxWidth:'85vw' });
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// Handle back link ?back param (modules linking to ra-portal)
// (ra-portal IS the back destination so no special handling needed here)

rpInit();
</script>
</body>
</html>
